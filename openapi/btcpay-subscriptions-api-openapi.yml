      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  SubscriberNeedUpgrade:
    post:
      operationId: Webhook_SubscriberNeedUpgrade
      summary: SubscriberNeedUpgrade
      description: A subscriber needs to upgrade their plan
      parameters:
      - in: header
        name: BTCPay-Sig
        required: true
        description: The HMAC of the body's byte with the secret's of the webhook. `sha256=HMAC256(UTF8(webhook's secret), body)`
        schema:
          type: string
          example: sha256=b438519edde5c8144a4f9bcec51a9d346eca6506887c2ceeae1c0092884a97b9
      tags:
      - Subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriberEvent'
      responses:
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    WebhookSubscriberDisabledEvent:
      description: Callback sent if the `type` is `SubscriberDisabled`
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriberEvent'
      - type: object
        properties:
          reason:
            $ref: '#/components/schemas/WebhookSubscriberDisabledReason'
            description: Whether the subscriber was disabled because of a suspension or expiration.
            example: Suspension
          suspensionReason:
            type:
            - string
            - 'null'
            description: Suspension reason provided by the merchant when `reason` is `Suspension`.
            example: Spam behavior detected.
    WebhookSubscriptionEvent:
      description: Base data for subscription webhooks.
      allOf:
      - $ref: '#/components/schemas/WebhookEvent'
      - type: object
        properties:
          storeId:
            type: string
            description: The store id of the subscription's event
            allOf:
            - $ref: '#/components/schemas/StoreId'
    WebhookPlanStartedEvent:
      description: Callback sent if the `type` is `PlanStarted`
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriberEvent'
      - type: object
        properties:
          autoRenew:
            type: boolean
            description: Whether the plan got renewed automatically.
    WebhookSubscriberEvent:
      description: Callback sent for subscription events tied to a subscriber.
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriptionEvent'
      - type: object
        properties:
          subscriber:
            $ref: '#/components/schemas/SubscriberModel'
            description: Subscriber associated with the event.
    PortalSessionModel:
      type: object
      description: Represents a subscriber portal session used for managing subscriptions, billing, and account details.
      properties:
        baseUrl:
          $ref: '#/components/schemas/BaseUrl'
        id:
          $ref: '#/components/schemas/PortalSessionId'
        subscriber:
          $ref: '#/components/schemas/SubscriberModel'
          description: The subscriber associated with this portal session.
        expiration:
          type:
          - integer
          - 'null'
          format: unix-time
          description: Expiration timestamp for the portal session.
          example: 1710602000
        isExpired:
          type: boolean
          description: Indicates whether the portal session is expired.
          example: false
        url:
          type: string
          description: Public URL where the subscriber can access the portal session.
          example: https://btcpay.example.com/subscriber-portal/ps_665afQ23ExGouiY4EZ
    WebhookSubscriberCreditedEvent:
      description: Callback sent if the `type` is `SubscriberCredited`
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriberEvent'
      - type: object
        properties:
          total:
            type: string
            format: decimal
            description: Subscriber's total credit after the adjustment.
            example: '110.00'
          amount:
            type: string
            format: decimal
            description: Amount credited to the subscriber.
            example: '10.00'
          currency:
            type: string
            description: Currency of the credit adjustment.
            example: USD
    UnixTimestamp:
      type: number
      format: int32
      example: 1592312018
      description: A unix timestamp in seconds
    PlanCheckoutModel:
      type: object
      description: Represents a checkout session for activating or purchasing a subscription plan.
      properties:
        subscriber:
          $ref: '#/components/schemas/SubscriberModel'
          description: Subscriber associated with the checkout. (It can be null if the checkout is for a new subscriber, and the users didn't [proceed with the checkout](#operation/ProceedPlanCheckout))
        plan:
          $ref: '#/components/schemas/OfferingPlanModel'
          description: Plan being purchased or activated.
        baseUrl:
          $ref: '#/components/schemas/BaseUrl'
        id:
          $ref: '#/components/schemas/PlanCheckoutId'
        invoiceId:
          $ref: '#/components/schemas/InvoiceId'
        successRedirectUrl:
          type: string
          description: URL to redirect the user after checkout success. (The `checkoutPlanId` query parameter will be added to the URL.)
          example: https://example.com/success
        expiration:
          type: integer
          format: unix-time
          description: Checkout expiration timestamp.
          example: 1710602000
        redirectUrl:
          type: string
          description: URL where the user is redirected to proceed with payment.
          example: https://pay.example.com/plancheckout_Hpm59L1NPCMUj477Q5
        invoiceMetadata:
          type: object
          description: Custom metadata that will be attached to the invoice when it is created.
          additionalProperties: true
          example:
            segment: gold
        metadata:
          type: object
          description: Custom metadata for the checkout.
          additionalProperties: true
          example:
            flow: upgrade
        newSubscriber:
          type: boolean
          description: Indicates whether the checkout is for a new subscriber.
          example: false
        isTrial:
          type: boolean
          description: Indicates if the checkout activates a trial.
          example: false
        created:
          type: integer
          format: unix-time
          description: Timestamp when checkout was created.
          example: 1710500000
        planStarted:
          type: boolean
          description: Indicates if the plan has already been activated.
          example: false
        newSubscriberMetadata:
          type: object
          description: Metadata for creating a new subscriber.
          additionalProperties: true
          example:
            welcomeTier: starter
        refundAmount:
          type:
          - string
          - 'null'
          description: Refund amount applied during migration.
          example: '3.50'
        creditedByInvoice:
          type: string
          description: Amount credited due to invoice settlement.
          example: '12.00'
        onPayBehavior:
          $ref: '#/components/schemas/OnPayBehavior'
          description: Defines how to apply payment behavior.
        isExpired:
          type: boolean
          description: Indicates whether the checkout session has expired.
          example: false
        url:
          type: string
          description: Public URL for accessing the checkout session.
          example: https://btcpay.example.com/plan-checkout/plancheckout_Hpm59L1NPCMUj477Q5
        creditPurchase:
          type:
          - string
          - 'null'
          description: Credit amount to purchase to top-up the account. Used when the user wants to top-up his credits. This will not automatically renew the plan.
          example: '10.00'
    SuspendSubscriberRequest:
      type: object
      description: Request payload for suspending a subscriber.
      properties:
        reason:
          type: string
          description: Reason for the suspension.
          example: Suspicious behavior detected
    BaseUrl:
      type: string
      description: Base URL of the BTCPay Server instance.
      example: https://btcpay.example.com/
    CreateOfferingModel:
      type: object
      description: New offering data to create.
      required:
      - appName
      properties:
        appName:
          type:
          - string
          - 'null'
          description: Display name of the related [application](#tag/Apps).
          example: Example App
        successRedirectUrl:
          type:
          - string
          - 'null'
          description: The default URL to redirect to after a plan checkout is successful.
          example: https://example.com/success
        metadata:
          type: object
          description: Custom metadata for the offering.
          additionalProperties: true
          example:
            category: saas
            region: us
        features:
          type:
          - array
          - 'null'
          description: List of features included in this offering.
          items:
            $ref: '#/components/schemas/FeatureModel'
    OfferingModel:
      allOf:
      - $ref: '#/components/schemas/CreateOfferingModel'
      - type: object
        description: Represents an offering available in a store.
        required:
        - appName
        properties:
          id:
            $ref: '#/components/schemas/OfferingId'
          storeId:
            $ref: '#/components/schemas/StoreId'
          appId:
            type: string
            description: Identifier of the related [application](#tag/Apps).
            example: app-001
          plans:
            type:
            - array
            - 'null'
            description: List of plans available for this offering.
            items:
              $ref: '#/components/schemas/OfferingPlanModel'
    WebhookEvent:
      type: object
      additionalProperties: false
      properties:
        deliveryId:
          type: string
          description: The delivery id of the webhook
        webhookId:
          type: string
          description: The id of the webhook
        originalDeliveryId:
          type: string
          description: If this delivery is a redelivery, the is the delivery id of the original delivery.
        isRedelivery:
          type: boolean
          description: True if this delivery is a redelivery
        type:
          type: string
          description: The type of this event, current available are `InvoiceCreated`, `InvoiceReceivedPayment`, `InvoiceProcessing`, `InvoiceExpired`, `InvoiceSettled`, `InvoiceInvalid`, `InvoicePaymentSettled`, `PaymentRequestCreated`, `PaymentRequestUpdated`, `PaymentRequestArchived`, `PaymentRequestStatusChanged`, `PayoutCreated`, `PayoutApproved`, `PayoutUpdated`, `SubscriberCreated`, `SubscriberCredited`, `SubscriberCharged`, `SubscriberActivated`, `SubscriberPhaseChanged`, `SubscriberDisabled`, `PaymentReminder`, `PlanStarted`, and `SubscriberNeedUpgrade`.
        timestamp:
          description: The timestamp when this delivery has been created
          allOf:
          - $ref: '#/components/schemas/UnixTimestamp'
    PortalSessionId:
      type: string
      example: ps_665afQ23ExGouiY4EZ
      description: Identifier of the portal session.
    OnPayBehavior:
      type: string
      description: 'Defines how the system should behave when payment is processed during a plan checkout or migration.

        * `SoftMigration`: Starts the plan only if payment is due. If no payment is due yet, the amount is added as credit instead of starting the plan.

        * `HardMigration`: Starts the plan immediately, even if payment is not due. If the user already paid for unused time, the unused portion is refunded before starting the plan.'
      enum:
      - HardMigration
      - SoftMigration
      example: SoftMigration
      x-enumDescriptions:
        SoftMigration: Starts the plan only if payment is due. If no payment is due yet, the amount is added as credit instead of starting the plan.
        HardMigration: Starts the plan immediately, even if payment is not due. If the user already paid for unused time, the unused portion is refunded before starting the plan.
    SubscriberModel:
      type: object
      description: Represents a subscriber of an offering.
      properties:
        created:
          type: integer
          format: unix-time
          description: Timestamp when the subscription was created.
          example: 1710598234
        customer:
          $ref: '#/components/schemas/CustomerModel'
          description: Customer associated with the subscription.
        offering:
          $ref: '#/components/schemas/OfferingModel'
          description: Offering associated with the subscription.
        plan:
          $ref: '#/components/schemas/OfferingPlanModel'
          description: Current active plan of the subscriber.
        periodEnd:
          type:
          - integer
          - 'null'
          format: unix-time
          description: End of the current billing period.
          example: 1713200000
        trialEnd:
          type:
          - integer
          - 'null'
          format: unix-time
          description: End of the subscriber's trial period.
          example: 1711000000
        gracePeriodEnd:
          type:
          - integer
          - 'null'
          format: unix-time
          description: End of the grace period.
          example: 1711500000
        isActive:
          type: boolean
          description: Indicates if the subscription is active. (Phase is not `Expired`, and not suspended)
          example: true
        isSuspended:
          type: boolean
          description: Indicates if the subscription is suspended.
          example: false
        suspensionReason:
          type:
          - string
          - 'null'
          description: Reason for suspension, if applicable.
          example: Suspicious activity detected
        autoRenew:
          type: boolean
          description: Indicates if the subscription renews automatically.
          example: true
        metadata:
          type: object
          description: Custom metadata for the subscription.
          additionalProperties: true
          example:
            segment: beta
        processingInvoiceId:
          type:
          - string
          - 'null'
          description: ID of the invoice being processed.
          example: inv_88443
        nextPlan:
          $ref: '#/components/schemas/OfferingPlanModel'
          description: Plan scheduled for next billing cycle.
        scheduledPlan:
          $ref: '#/components/schemas/OfferingPlanModel'
          description: Plan scheduled to activate at the end of the current billing period.
        scheduledPlanActivatesAt:
          type:
          - integer
          - 'null'
          format: unix-time
          description: Timestamp when the scheduled plan change will activate.
          example: 1713200000
        phase:
          $ref: '#/components/schemas/SubscriptionPhase'
    OfferingPlanModel:
      type: object
      description: Represents a pricing plan for an offering.
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        name:
          type: string
          description: Display name of the plan.
          example: Starter Plan
        status:
          type: string
          description: Current status of the plan.
          enum:
          - Active
          - Retired
          example: Active
        price:
          type: string
          description: Price of the plan as a numeric string.
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '19.99'
        currency:
          type: string
          description: Currency code for the price.
          example: USD
        recurringType:
          type: string
          description: Recurring interval for billing.
          enum:
          - Lifetime
          - Monthly
          - Quarterly
          - Yearly
          example: Monthly
        gracePeriodDays:
          type: integer
          description: Number of grace period days after expiry.
          example: 7
        trialDays:
          type: integer
          description: Number of trial days before billing.
          example: 14
        description:
          type: string
          description: Short description of the plan.
          example: Standard monthly subscription.
        memberCount:
          type: integer
          description: Maximum number of members allowed under this plan.
          example: 10
        optimisticActivation:
          type: boolean
          description: Indicates if the plan is activated before payment confirmation.
          example: true
        features:
          type: array
          description: List of feature identifiers included in this plan.
          items:
            type: string
          example:
          - feature-analytics
        renewable:
          type: boolean
          description: Indicates if the plan can be renewed.
          example: true
        metadata:
          type: object
          description: Custom metadata for the plan.
          additionalProperties: true
          example:
            tier: standard
    CreditModel:
      type: object
      description: Represents a subscriber's credit balance in a specific currency.
      properties:
        currency:
          type: string
          description: Currency code of the credit balance.
          example: USD
        value:
          type: string
          description: Current credit value as a numeric string.
          example: '150.00'
    CustomerModel:
      type: object
      description: Represents a customer associated with a store.
      properties:
        storeId:
          $ref: '#/components/schemas/StoreId'
        id:
          $ref: '#/components/schemas/CustomerId'
        externalId:
          type: string
          description: External system identifier for the customer.
          example: ext_4455
        identities:
          type: object
          description: Identity attributes for matching and lookup (e.g., email, username).
          additionalProperties: true
          example:
            Email: subscriber@example.com
        metadata:
          type: object
          description: Custom metadata associated with the customer.
          additionalProperties: true
          example:
            segment: premium
            locale: en-US
    SubscriptionPhase:
      type: string
      description: Lifecycle phase of the subscription.
      enum:
      - Expired
      - Grace
      - Normal
      - Trial
      example: Normal
    StoreId:
      type: string
      description: Store ID of the item
      example: 9CiNzKoANXxmk5ayZngSXrHTiVvvgCrwrpFQd4m2K776
    CustomerSelector:
      type: string
      description: 'Flexible identifier for selecting a customer. Supports: customer ID (e.g., `cust_abc123`), an email (e.g., `user@example.com`), or a key/value identity (e.g., `Email:user@example.com`).'
      example: cust_GUGnpx3311fkaqGk7f
    CreatePlanRequest:
      type: object
      description: Request payload for creating a new offering plan.
      properties:
        name:
          type: string
          description: Display name of the plan.
          example: Monthly Plan
        description:
          type: string
          description: Short description of the plan.
          example: Standard monthly subscription.
        currency:
          type: string
          description: Currency code for the plan price.
          example: USD
        gracePeriodDays:
          type:
          - integer
          - 'null'
          description: Number of grace period days after expiry.
          example: 7
        optimisticActivation:
          type:
          - boolean
          - 'null'
          description: Indicates if the plan is activated before payment confirmation.
          example: true
        price:
          type:
          - string
          - 'null'
          description: Price of the plan as a numeric string.
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '19.99'
        renewable:
          type:
          - boolean
          - 'null'
          description: Indicates if the plan can be renewed.
          example: true
        trialDays:
          type:
          - integer
          - 'null'
          description: Number of trial days before billing.
          example: 14
        metadata:
          type: object
          description: Custom metadata for the plan.
          additionalProperties: true
          example:
            tier: standard
        recurringType:
          type:
          - string
          - 'null'
          description: Recurring interval for billing.
          enum:
          - Lifetime
          - Monthly
          - Quarterly
          - Yearly
          example: Monthly
        features:
          type:
          - array
          - 'null'
          description: List of features from the offering included in this plan.
          items:
            type: string
          example:
          - feature-analytics
    ProblemDetails:
      type: object
      description: Description of an error happening during processing of the request
      properties:
        code:
          type: string
          description: An error code describing the error
        message:
          type: string
          description: User friendly error message about the error
    PlanCheckoutId:
      type: string
      description: Unique identifier of the plan checkout session.
      example: plancheckout_Hpm59L1NPCMUj477Q5
    OfferingId:
      type: string
      description: Offering's ID
      example: offering_DKWhZGB6PZsgTcPwpf
    UpdateCreditRequest:
      type: object
      description: Request payload for updating subscriber credit.
      properties:
        credit:
          type: string
          description: Amount of credit to add as a numeric string.
          example: '25.00'
        charge:
          type: string
          description: Amount to deduct as a numeric string.
          example: '10.00'
        description:
          type: string
          description: Short description explaining the credit change.
          example: Monthly reward bonus
        allowOverdraft:
          type: boolean
          description: Indicates if the credit balance is allowed to go negative.
          example: false
    PlanId:
      type: string
      description: Plan's ID
      example: plan_KZMVyuQp3v2vFWnEUM
    WebhookSubscriberChargedEvent:
      description: Callback sent if the `type` is `SubscriberCharged`
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriberEvent'
      - type: object
        properties:
          total:
            type: string
            format: decimal
            description: Subscriber's total credit after the charge.
            example: '90.00'
          amount:
            type: string
            format: decimal
            description: Amount charged from the subscriber.
            example: '10.00'
          currency:
            type: string
            description: Currency of the charge.
            example: USD
    InvoiceId:
      type: string
      description: The invoice ID
      example: HMprBnL9BTXWuPvpoKBS6e
    WebhookSubscriberPhaseChangedEvent:
      description: Callback sent if the `type` is `SubscriberPhaseChanged`
      allOf:
      - $ref: '#/components/schemas/WebhookSubscriberEvent'
      - type: object
        properties:
          previousPhase:
            allOf:
            - $ref: '#/components/schemas/SubscriptionPhase'
            description: Previous subscription phase.
            example: Trial
          currentPhase:
            allOf:
            - $ref: '#/components/schemas/SubscriptionPhase'
            description: Current subscription phase.
            example: Normal
    CreatePlanCheckoutRequest:
      type: object
      description: Request payload for initiating a plan checkout session.
      properties:
        storeId:
          $ref: '#/components/schemas/StoreId'
        offeringId:
          $ref: '#/components/schemas/OfferingId'
        planId:
          $ref: '#/components/schemas/PlanId'
        customerSelector:
          $ref: '#/components/schemas/CustomerSelector'
        durationMinutes:
          type:
          - integer
          - 'null'
          description: How long the checkout session is valid, in minutes.
          example: 30
        onPayBehavior:
          $ref: '#/components/schemas/OnPayBehavior'
          default: SoftMigration
        newSubscriberMetadata:
          type: object
          description: Metadata used when creating a new subscriber.
          additionalProperties: true
          example:
            locale: en-US
        invoiceMetadata:
          type: object
          description: Metadata attached to the created invoice.
          additionalProperties: true
          example:
            campaign: winter-sale
        metadata:
          type: object
          description: Custom metadata for the checkout session.
          additionalProperties: true
          example:
            flow: upgrade
        isTrial:
          type:
          - boolean
          - 'null'
          description: Indicates if the checkout starts a trial.
          example: false
        creditPurchase:
          type:
          - string
          - 'null'
          description: Amount of credit to purchase.
          example: '20.00'
        successRedirectLink:
          type: string
          description: URL to redirect the user after checkout success. (This default to offering's successRedirectLink, also, the `checkoutPlanId` query parameter will be added to the URL.)
          example: https://example.com/thank-you
        newSubscriberEmail:
          type:
          - string
          - 'null'
          description: Email address for creating a new subscriber. Keep `null` to let the user choose an email address in the checkout page.
          example: user@example.com
    CustomerId:
      type: string
      description: Unique identifier of the customer.
      example: cust_GUGnpx3311fkaqGk7f
    FeatureModel:
      type: object
      description: Represents a feature that can be included in an offering or plan.
      required:
      - description
      - id
      properties:
        id:
          type: string
          description: Unique identifier of the feature.
          example: feature-analytics
        description:
          type: string
          description: Short description of the feature.
          example: Access to analytics dashboard.
    UpdateSubscriberDatesRequest:
      type: object
      description: Request payload for updating subscriber dates. All fields are optional — omitting a field leaves the corresponding date unchanged.
      properties:
        startDate:
          type:
          - integer
          - 'null'
          format: unix-time
          description: New subscription start date as a Unix timestamp. Omit to leave the current start date unchanged.
          example: 1710000000
        expirationDate:
          type:
          - integer
          - 'null'
          format: unix-time
          description: New expiration date as a Unix timestamp. Updates `trialEnd` if the subscriber is in a trial, otherwise updates `periodEnd`. Grace period end and reminder date are recalculated automatically. Omit to leave the current expiration date unchanged.
          example: 1712678400
    CreatePortalSessionRequest:
      type: object
      description: Request payload for creating a subscriber portal session.
      properties:
        storeId:
          $ref: '#/components/schemas/StoreId'
        offeringId:
          $ref: '#/components/schemas/OfferingId'
        customerSelector:
          $ref: '#/components/schemas/CustomerSelector'
        durationMinutes:
          type:
          - integer
          - 'null'
          description: Duration in minutes before the portal session expires.
          example: 30
    WebhookSubscriberDisabledReason:
      type: string
      description: Reason why the subscriber was disabled.
      enum:
      - Expired
      - Suspension
      example: Suspension
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      description: The store ID
      schema:
        $ref: '#/components/schemas/StoreId'
    OfferingId:
      name: offeringId
      in: path
      required: true
      description: Offering's ID
      example: offering_DKWhZGB6PZsgTcPwpf
      schema:
        $ref: '#/components/schemas/OfferingId'
    CustomerSelector:
      name: customerSelector
      in: path
      required: true
      description: 'Flexible customer selector. Supports: a customer ID (e.g., `cust_GUGnpx3311fkaqGk7f`), an email (e.g., `subscriber@example.com`), or a key/value identity (e.g., `Email:subscriber@example.com`).'
      schema:
        $ref: '#/components/schemas/CustomerSelector'
    PortalSessionId:
      name: portalSessionId
      in: path
      required: true
      example: ps_665afQ23ExGouiY4EZ
      description: Identifier of the portal session.
      schema:
        $ref: '#/components/schemas/PortalSessionId'
    PlanCheckoutId:
      name: checkoutId
      in: path
      required: true
      example: plancheckout_Hpm59L1NPCMUj477Q5
      description: Unique identifier of the plan checkout session.
      schema:
        $ref: '#/components/schemas/PlanCheckoutId'
    PlanId:
      name: planId
      in: path
      required: true
      description: Plan's ID
      example: plan_KZMVyuQp3v2vFWnEUM
      schema:
        $ref: '#/components/schemas/PlanId'
    Subscriptions_Currency:
      name: currency
      in: path
      required: true
      description: Currency code for the credit balance. Use `current` to retrieve the current balance in the currency of the current plan.
      schema:
        type: string
      example: current
  securitySchemes:
    API_Key:
      type: apiKey
      description: "BTCPay Server supports authenticating and authorizing users through an API Key that is generated by them. Send the API Key as a header value to Authorization with the format: `token {token}`. For a smoother experience, you can generate a url that redirects users to an API key creation screen.\n\n The following permissions are available to the context of the user creating the API Key:\n\n* `btcpay.impersonation.canimpersonate`: Can impersonate users\n* `btcpay.user.candeleteuser`: Delete user\n* `btcpay.user.canmanagenotificationsforuser`: Manage your notifications\n* `btcpay.user.canmodifyprofile`: Manage your profile\n* `btcpay.user.canviewnotificationsforuser`: View your notifications\n* `btcpay.user.canviewprofile`: View your profile\n* `unrestricted`: Unrestricted access\n\nThe following permissions are available if the user is an administrator:\n\n* `btcpay.server.cancreatelightninginvoiceinternalnode`: Create invoices with internal lightning node\n* `btcpay.server.cancreateuser`: Create new users\n* `btcpay.server.canmanageusers`: Manage users\n* `btcpay.server.canmodifyserversettings`: Manage your server\n* `btcpay.server.canuseinternallightningnode`: Use the internal lightning node\n* `btcpay.server.canviewlightninginvoiceinternalnode`: View invoices from internal lightning node\n* `btcpay.server.canviewusers`: View users\n\nThe following permissions applies to all stores of the user, you can limit to a specific store with the following format: `btcpay.store.cancreateinvoice:6HSHAEU4iYWtjxtyRs9KyPjM9GAQp8kw2T9VWbGG1FnZ`:\n\n* `btcpay.store.canarchivepullpayments`: Archive your pull payments\n* `btcpay.store.canbroadcasttransactions`: Broadcast wallet transactions\n* `btcpay.store.cancanceltransactions`: Cancel wallet transactions\n* `btcpay.store.cancreateinvoice`: Create an invoice\n* `btcpay.store.cancreatelightninginvoice`: Create invoices from the lightning nodes associated with your stores\n* `btcpay.store.cancreatenonapprovedpullpayments`: Create non-approved pull payments\n* `btcpay.store.cancreatepullpayments`: Create pull payments\n* `btcpay.store.cancreatetransactions`: Create wallet transactions\n* `btcpay.store.cancreditsubscribers`: Credit your subscribers\n* `btcpay.store.canmanageinvoicestatus`: Manage invoice status\n* `btcpay.store.canmanagelegacyaccesstokens`: Manage legacy access tokens\n* `btcpay.store.canmanagepayouts`: Manage payouts\n* `btcpay.store.canmanagepullpayments`: Manage your pull payments\n* `btcpay.store.canmanagesubscribers`: Manage your subscribers\n* `btcpay.store.canmanagewallets`: Manage wallets\n* `btcpay.store.canmanagewalletsettings`: Manage wallet settings\n* `btcpay.store.canmanagewallettransactions`: Manage wallet transactions\n* `btcpay.store.canmodifyinvoices`: Modify invoices\n* `btcpay.store.canmodifyofferings`: Modify your offerings\n* `btcpay.store.canmodifypaymentrequests`: Modify your payment requests\n* `btcpay.store.canmodifystoresettings`: Modify your stores\n* `btcpay.store.cansendstoreemails`: Send store emails\n* `btcpay.store.cansigntransactions`: Sign wallet transactions\n* `btcpay.store.canuselightningnode`: Use the lightning nodes associated with your stores\n* `btcpay.store.canviewinvoices`: View invoices\n* `btcpay.store.canviewlightninginvoice`: View the lightning invoices associated with your stores\n* `btcpay.store.canviewofferings`: View your offerings\n* `btcpay.store.canviewpaymentrequests`: View your payment requests\n* `btcpay.store.canviewpayouts`: View payouts\n* `btcpay.store.canviewpullpayments`: View your pull payments\n* `btcpay.store.canviewreports`: View your reports\n* `btcpay.store.canviewstoresettings`: View your stores\n* `btcpay.store.canviewwallet`: View wallets\n* `btcpay.store.webhooks.canmodifywebhooks`: Modify stores webhooks\n\nNote that API Keys only limits permission of a user and can never expand it. If an API Key has the permission `btcpay.server.canmodifyserversettings` but that the user account creating this API Key is not administrator, the API Key will not be able to modify the server settings.\nSome permissions may include other permissions, see [this operation](#operation/permissionsMetadata).\n"
      name: Authorization
      in: header
    Basic:
      type: http
      description: BTCPay Server supports authenticating and authorizing users through the Basic HTTP authentication scheme during the first five minutes after account creation or when the user explicitly enables it. Send the user and password encoded in base64 with the format `Basic {base64(username:password)}`. Using this authentication method implicitly provides you with the `unrestricted` permission
      scheme: Basic
